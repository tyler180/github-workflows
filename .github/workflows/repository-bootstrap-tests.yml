name: Test repository bootstrap
on:
  pull_request:
    paths:
      - automation/repository-bootstrap/**
      - .github/workflows/repository-bootstrap*.yml
  push:
    branches: [main]
    paths:
      - automation/repository-bootstrap/**
      - .github/workflows/repository-bootstrap*.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s automation/repository-bootstrap -p 'test_*.py'
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/repository-bootstrap.yml .github/workflows/repository-bootstrap-tests.yml
