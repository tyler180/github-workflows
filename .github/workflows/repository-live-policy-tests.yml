name: Test repository live policy
on:
  pull_request:
    paths:
      - automation/repository-policy/**
      - .github/workflows/repository-live-policy-tests.yml
  push:
    branches: [main]
    paths:
      - automation/repository-policy/**
      - .github/workflows/repository-live-policy-tests.yml
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s automation/repository-policy -p 'test_*.py'
