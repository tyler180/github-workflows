name: Validate shared GitOps release
on:
  push:
    paths:
      - .github/workflows/reusable-release.yaml
      - .github/workflows/validate-gitops-release.yaml
      - automation/**
  pull_request:
    paths:
      - .github/workflows/reusable-release.yaml
      - .github/workflows/validate-gitops-release.yaml
      - automation/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Test promotion behavior
        run: |
          python3 -m venv "$RUNNER_TEMP/manifest-tests"
          "$RUNNER_TEMP/manifest-tests/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/manifest-tests/bin/python" -m unittest discover -s automation/tests -v
      - name: Validate workflow syntax
        run: |
          GOBIN="$RUNNER_TEMP/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes= .github/workflows/reusable-release.yaml .github/workflows/validate-gitops-release.yaml
