- id: repository-hygiene
  name: Repository hygiene
  entry: hooks/repository_hygiene.py
  language: script
  types: [text]
- id: secret-scan
  name: Secret detection (Gitleaks 8.30.1)
  entry: hooks/secret_scan.py --staged
  language: script
  pass_filenames: false
  always_run: true
- id: secret-scan-setup
  name: Prepare pinned Gitleaks
  entry: hooks/secret_scan.py --install-only
  language: script
  pass_filenames: false
  always_run: true
  stages: [manual]
- id: codex-review
  name: Optional advisory AI review
  verbose: true
  entry: hooks/codex_review.py
  language: script
  stages: [pre-commit]
  pass_filenames: false
  always_run: true
