apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jobtracker-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nas-nfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobtracker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jobtracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobtracker
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jobtracker
          # Replace with a published, digest-pinned image before deployment.
          image: ghcr.io/tyler180/jobtracker:v0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ':8080'
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jobtracker-data
---
apiVersion: v1
kind: Service
metadata:
  name: jobtracker
spec:
  selector:
    app.kubernetes.io/name: jobtracker
  ports:
    - name: http
      port: 80
      targetPort: http
